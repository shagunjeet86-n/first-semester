



<html>
    <body>
        <h1>Addmission Form</h1>
        <Form action="/addmisionForm"  method="get">
            <lable for="name">Name:</lable> &nbsp;
            <input type="text" id="name" name="user name" required placeholder="Enter your Name">

            <br>
            <lable for="Fathes's Name">Father's Name:</lable>
            <input type="text" id="Father's Name" name="father's name" required placeholder="Enter your Father's Name">

            <br>

            <input type = "email" id="email" name="userEmail" required placeholder="Enter your Email">

           <br>

           <br>

           <input type="text" id="address" placeholder="Enter your address">

           <br>

           <br>

           <br>
           <br>

           <input type="date" id="DOB" name="DOB" required>
           <br>
           <br>

            <input type="radio" name="Gender" value="female" >
            Female
           </lable>

            Male
           </label>
           <lable>
            <input type="radio" name="Gender" value="Other">
            Other
           </lable>

           <br>
           <br>
            <label>
            <span>Programing lang</span>

            <input type="checkbox" name="language lang" value="C">

            </label>

           <br>

            <select id="country" name="country">

                <option value="Afganistan">Afganistan</option>
            </select>
    
            <br>
            <br>
            

               <button type="submit">SUBMIT</button>
               <button type="reset">RESET</button>
               
        </Form>

</html>
